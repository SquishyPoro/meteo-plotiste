name: aladin
on:
  schedule:
    - cron: '50 3,9,15,21 * * *'   # cca 3–4 h po behoch 00/06/12/18 UTC, keď ČHMÚ zverejní dáta
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aladin
  cancel-in-progress: false
jobs:
  aladin:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements-aladin.txt
      - run: pip install -q -r pipeline/requirements-aladin.txt
      - name: Spracovať ALADIN
        run: |
          set -o pipefail
          if python pipeline/aladin.py 2>&1 | tee run.log; then
            echo "::notice title=Výsledok::$(tail -n 12 run.log | sed ':a;N;$!ba;s/\n/%0A/g')"
          else
            echo "::error title=Chyba::$(tail -n 25 run.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Uložiť
        run: |
          git add data/aladin.json data/aladin
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "meteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ALADIN $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
