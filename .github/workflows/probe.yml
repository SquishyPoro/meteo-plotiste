name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          H=https://opendata.chmi.cz/meteorology/climate/historical_csv/data/daily
          { curl -sS -m 60 $H/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 3000
            for d in $(curl -sS -m 60 $H/ | grep -o 'href="[^"]*/"' | cut -d'"' -f2 | grep -v '\.\.' | head -30); do echo "== $d"; curl -sS -m 60 "$H/$d" | grep -o 'href="[^"]*"' | grep -E '11649|H3HRAD' | head -5; done
          } > daily-list.txt 2>&1
          F=$(grep -o '"[^"]*11649[^"]*"' daily-list.txt | head -1)
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/historical_csv/metadata/meta1.csv | grep -i "11649\|^WSI\|^\"WSI" | head -5 > meta1.txt
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/historical_csv/metadata/meta4.csv > meta4.csv
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/historical_csv/metadata/meta3.csv > meta3.csv
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/historical_csv/metadata/meta2.csv | grep "11649" | head -40 > meta2-hk.txt
          for d in $(curl -sS -m 60 $H/ | grep -o 'href="[^"]*/"' | cut -d'"' -f2 | grep -v '\.\.' | head -30); do
            f=$(curl -sS -m 60 "$H/$d" | grep -o 'href="[^"]*11649[^"]*"' | cut -d'"' -f2 | head -1)
            [ -n "$f" ] && { echo "== $d$f"; curl -sS -m 120 "$H/$d$f" | head -5; curl -sS -m 120 "$H/$d$f" | wc -l; } >> samples.txt
          done
          echo "== recent daily" >> samples.txt
          curl -sS -m 60 "https://opendata.chmi.cz/meteorology/climate/recent/data/daily/dly-0-203-0-11649-$(date -u +%Y%m).json" | python3 -c "import json,sys,collections;v=json.load(sys.stdin)['data']['data']['values'];print(collections.Counter(x[1]+'/'+x[2] for x in v));print([x for x in v if x[3].startswith('$(date -u +%Y-%m)-2')][:30])" >> samples.txt
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/recent/data/daily/ | grep -o 'href="[^"]*11649[^"]*"' | head -20 >> samples.txt
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
