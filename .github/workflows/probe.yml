name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          O="Origin: https://squishyporo.github.io"
          ls_() { curl -sS -m 60 "$1" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c ${2:-1500}; echo; }
          Y=https://opendata.chmi.cz/hydrology
          { echo "== hydro"; ls_ $Y/ ; ls_ $Y/now/ ; ls_ $Y/now/data/ 2500; ls_ $Y/now/metadata/ 1500; } > hydro.txt 2>&1
          M=$(curl -sS -m 60 $Y/now/metadata/ | grep -o 'href="[^"]*json"' | cut -d'"' -f2 | head -3)
          for f in $M; do echo "== $f"; curl -sS -m 60 "$Y/now/metadata/$f" | head -c 1500; echo; curl -sS -m 60 "$Y/now/metadata/$f" | grep -i -o '.\{200\}\(Hradec\|Předměřice\|Orlice\|Němčice\|Týniště\|Jaroměř\|Labe\).\{200\}' | head -20; done > hydro-meta.txt 2>&1
          D=$(curl -sS -m 60 $Y/now/data/ | grep -o 'href="[^"]*"' | cut -d'"' -f2 | grep -v '/$\|\.\.' | head -3)
          for f in $D; do echo "== $f"; curl -sS -m 60 "$Y/now/data/$f" | head -c 2500; echo; done > hydro-data.txt 2>&1
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
