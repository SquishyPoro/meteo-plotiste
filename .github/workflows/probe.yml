name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          R=https://opendata.chmi.cz/meteorology/climate/recent
          curl -sS -m 60 $R/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' > recent.txt
          curl -sS -m 60 $R/data/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 3000 >> recent.txt
          for d in $(curl -sS -m 60 $R/data/ | grep -o 'href="[^"]*/"' | cut -d'"' -f2 | grep -v '\.\.' | head -6); do echo "=== $d"; curl -sS -m 60 "$R/data/$d" | grep -o 'href="[^"]*"' | grep -E '11649|11651' | head -8; done >> recent.txt
          N=https://opendata.chmi.cz/meteorology/climate/now/data
          D=$(date -u +%Y%m%d)
          curl -sS -m 60 "$N/10m-0-203-0-11651-$D.json" > sd.json
          python3 -c "import json,collections;v=json.load(open('sd.json'))['data']['data']['values'];print(collections.Counter(x[1] for x in v))" > svobodne-dvory.txt 2>&1
          for m in ecmwf_ifs025 icon_seamless gfs_seamless meteofrance_seamless ukmo_seamless gem_seamless; do
            echo "=== $m"; curl -sS -m 60 "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=50.236&longitude=15.79&hourly=temperature_2m_previous_day1,temperature_2m_previous_day5,wind_gusts_10m_previous_day2,precipitation_previous_day2&models=$m&start_date=2026-07-01&end_date=2026-07-01&timezone=GMT" | head -c 700; echo
          done > prevruns.txt
          curl -sS -m 60 "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=50.236&longitude=15.79&hourly=temperature_2m_previous_day1&models=ecmwf_ifs025&start_date=2025-01-01&end_date=2025-01-01" | head -c 400 >> prevruns.txt
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
