name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          curl -sS -m 30 https://api.rainviewer.com/public/weather-maps.json -o rv.json
          python3 - <<'PY'
          import json, urllib.request, os
          d = json.load(open('rv.json'))
          for f in d['radar']['past'][-7:]:
            for x in (68, 69, 70):
              for y in (42, 43, 44):
                path = f"{f['path']}/256/7/{x}/{y}/2/0_0.png"
                os.makedirs('tiles' + os.path.dirname(path), exist_ok=True)
                open('tiles' + path, 'wb').write(urllib.request.urlopen(d['host'] + path, timeout=30).read())
          PY
          cd .. && git init -q probe && cp -r out/rv.json out/tiles probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
