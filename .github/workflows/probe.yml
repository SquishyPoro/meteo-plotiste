name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          C=https://opendata.chmi.cz/meteorology/weather/alerts/cap/
          curl -sS -m 60 $C > list.html
          python3 - <<'PY'
          import re, datetime, urllib.request
          html = open('list.html').read()
          rows = re.findall(r'href="([^"]+\.xml)">[^<]*</a>\s+(\d\d-\w\w\w-\d{4} \d\d:\d\d)\s+(\d+)', html)
          rows = sorted(rows, key=lambda r: datetime.datetime.strptime(r[1], '%d-%b-%Y %H:%M'))
          open('cap-list.txt', 'w').write('\n'.join(' '.join(r) for r in rows[-15:]) + f'\ncount {len(rows)}\n')
          for name, _, size in rows[-3:]:
            open('cap-' + name, 'wb').write(urllib.request.urlopen('https://opendata.chmi.cz/meteorology/weather/alerts/cap/' + name).read())
          PY
          rm list.html
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
