name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          B=https://opendata.chmi.cz/meteorology/climate/now
          curl -sS -m 60 $B/metadata/ | grep -o 'href="[^"]*"' > meta-hrefs.txt
          curl -sS -m 60 $B/data/ | grep -o 'href="[^"]*"' | grep -E '116(4|5|6)' > data-hk-hrefs.txt
          for f in $(grep -o '"[^"]*json"' meta-hrefs.txt | tr -d '"' | head -5); do echo "=== $f"; curl -sS -m 60 "$B/metadata/$f" | head -c 3000; echo; done > meta-samples.txt
          for f in $(grep -o '"[^"]*json"' meta-hrefs.txt | tr -d '"'); do curl -sS -m 60 "$B/metadata/$f" | grep -o '.\{300\}Hradec.\{300\}' | head -5; done > meta-hradec.txt
          F=$(grep -o '"[^"]*json"' data-hk-hrefs.txt | tr -d '"' | tail -1); echo "$F" > data-sample.txt; curl -sS -m 60 "$B/data/$F" | head -c 4000 >> data-sample.txt
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
