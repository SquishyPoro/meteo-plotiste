name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          O="Origin: https://squishyporo.github.io"
          ls_() { curl -sS -m 60 "$1" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c ${2:-1500}; echo; }
          python3 - <<'PY'
          import json, math, urllib.request
          Y = 'https://opendata.chmi.cz/hydrology/now/'
          g = lambda u: json.load(urllib.request.urlopen(u, timeout=60))
          out = open('stations.txt', 'w')
          m = g(Y + 'metadata/meta1.json')['data']['data']
          h = m['header'].split(',')
          near = []
          for v in m['values']:
            r = dict(zip(h, v))
            d = math.hypot((r['GEOGR1'] - 50.236) * 111, (r['GEOGR2'] - 15.79) * 71)
            if d < 30: near.append((d, r))
          for d, r in sorted(near, key=lambda x: x[0]):
            out.write(f"{d:5.1f} km {json.dumps(r, ensure_ascii=False)}\n")
          for name in ('meta2.json', 'meta3.json'):
            out.write('== ' + name + '\n' + json.dumps(g(Y + 'metadata/' + name), ensure_ascii=False)[:1500] + '\n')
          for d, r in sorted(near, key=lambda x: x[0])[:5]:
            try:
              j = g(Y + 'data/' + r['objID'] + '.json')
              for o in j['objList']:
                for ts in o['tsList']:
                  out.write(f"{r['STATION_NAME']} {ts['tsConID']} {ts.get('unit')} n={len(ts['tsData'])} last={ts['tsData'][-1] if ts['tsData'] else None}\n")
            except Exception as e:
              out.write(f"{r['objID']} ERR {e}\n")
          PY
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
