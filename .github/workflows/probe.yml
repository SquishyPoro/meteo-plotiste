name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          B=https://opendata.chmi.cz/meteorology/climate/now
          D=$(date -u +%Y%m%d)
          for m in meta1 meta2 meta3 meta4; do curl -sS -m 60 "$B/metadata/$m-$D.json" > $m.json; done
          grep -h -i -E 'Hradec|11649|1164[05]|1165[156]|Plotiš' meta*.json > meta-hradec.txt
          for m in meta2 meta3 meta4; do echo "=== $m"; head -c 2500 $m.json; echo; done > meta-heads.txt
          grep -h -E '"(T|TPM|H|F|Fmax|D|SRA1H|P|SSV1H|SVH|SCE|Dmax|T05|TMA|TMI|SNO)"' meta2.json meta3.json meta4.json | head -60 > meta-elements.txt
          curl -sS -m 60 "$B/data/1h-0-203-0-11649-$D.json" > hk1h.json
          python3 -c "import json;d=json.load(open('hk1h.json'));v=d['data']['data']['values'];import collections;c=collections.Counter(x[1] for x in v);print(c);print([x for x in v if x[2]==max(y[2] for y in v)])" > hk1h-summary.txt 2>&1
          curl -sS -m 60 "$B/data/10m-0-203-0-11649-$D.json" > hk10m.json
          python3 -c "import json;d=json.load(open('hk10m.json'));v=d['data']['data']['values'];import collections;c=collections.Counter(x[1] for x in v);print(c);print([x for x in v if x[2]==max(y[2] for y in v)])" > hk10m-summary.txt 2>&1
          rm -f meta1.json meta2.json meta3.json meta4.json hk1h.json hk10m.json
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
