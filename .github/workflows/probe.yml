name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          mkdir out && cd out
          for u in https://opendata.chmi.cz/ https://opendata.chmi.cz/meteorology/ https://opendata.chmi.cz/meteorology/climate/ https://opendata.chmi.cz/meteorology/climate/now/ https://opendata.chmi.cz/meteorology/climate/now/data/ https://opendata.chmi.cz/meteorology/climate/now/metadata/; do
            echo "=== $u"; curl -sS -m 60 "$u" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 4000; echo
          done > chmi.txt 2>&1
          curl -sS -m 60 https://opendata.chmi.cz/meteorology/climate/now/data/ | grep -o 'href="[^"]*"' > chmi-now-data-hrefs.txt 2>&1
          curl -sS -m 30 "https://aviationweather.gov/api/data/metar?ids=LKPD,LKHK&format=json&hours=2" > metar.json 2>&1
          curl -sS -m 30 "https://previous-runs-api.open-meteo.com/v1/forecast?latitude=50.236&longitude=15.79&hourly=temperature_2m,temperature_2m_previous_day1&models=ecmwf_ifs025&past_days=2&forecast_days=1" > prevruns.json 2>&1
          cd .. && git init -q probe && cp out/* probe/ && cd probe
          git config user.name probe && git config user.email probe@users.noreply.github.com
          git add -A && git commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/probe-out
